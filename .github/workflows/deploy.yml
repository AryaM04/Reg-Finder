# Test the Worker, then deploy it to Cloudflare, on each push to main.
# The workflow needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# The DVLA API key stays a Worker secret in Cloudflare. A deploy does not change it.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Do not run two deploys at the same time. A new push waits for the deploy before it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test
        run: node --test test/*.test.js
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
      # Cloudflare bot protection can block requests from GitHub runners with status 403.
      # Thus, a failed check gives a warning, not a failed deploy.
      - name: Check the live site
        run: |
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' https://akm.dev/regfinder/api/config)
          if [ "$code" = "200" ]; then
            echo "The live site replied 200."
          else
            echo "::warning::The live site replied $code. Cloudflare bot protection can block GitHub runners. Open https://akm.dev/regfinder/ to check the site."
          fi
