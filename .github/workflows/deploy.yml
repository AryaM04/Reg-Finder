# Test the Worker, then deploy it to Cloudflare, on each push to main.
# The workflow needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# The DVLA API key stays a Worker secret in Cloudflare. A deploy does not change it.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Do not run two deploys at the same time. A new push waits for the deploy before it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test
        run: node --test test/*.test.js
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
      - name: Check the live site
        run: curl --fail --silent --show-error https://akm.dev/regfinder/api/config
